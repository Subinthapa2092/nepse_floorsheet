name: Daily data sync

# Copies new prices + fundamentals from the nepse-analytics project into the main Arthotix project.
# Runs Mon-Fri after the market closes (16:30 and 21:00 Nepal time; the second run catches late-filled closes).
# Times below are UTC. You can also run it by hand: Actions tab > Daily data sync > Run workflow.
on:
  schedule:
    - cron: '45 10 * * 1-5'
    - cron: '15 15 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Sync
        env:
          SRC_URL: ${{ secrets.SRC_URL }}
          SRC_KEY: ${{ secrets.SRC_KEY }}
          DST_URL: ${{ secrets.DST_URL }}
          DST_KEY: ${{ secrets.DST_KEY }}
        run: python sync_from_analytics.py --go
