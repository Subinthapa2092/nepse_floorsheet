name: Fetch Full Market Depth and Company Details

# The scheduled runs were replaced by live-loop.yml:
#   - market depth is now refreshed continuously in small slices (latest only),
#   - company details are fetched once a day after the close.
# This stays as a manual "Run workflow" button for a one-off refresh.
# Note: it still writes the old history table (market_depth_snapshots).

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full-market watchlist fetcher (company details + market depth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_watchlist.py
