name: Fetch Full Market Depth and Company Details

on:
  schedule:
    - cron: "3 5 * * 1,2,3,4,5"
    - cron: "3 6 * * 1,2,3,4,5"
    - cron: "3 7 * * 1,2,3,4,5"
    - cron: "3 8 * * 1,2,3,4,5"
    - cron: "3 9 * * 1,2,3,4,5"
  workflow_dispatch: {}
  
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # safety net in case of a slow/stuck run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full-market watchlist fetcher (company details + market depth)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_watchlist.py