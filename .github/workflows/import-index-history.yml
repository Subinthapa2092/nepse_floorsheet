name: Import Index History (one-time / manual)

# Manual only: no schedule, never runs on its own, doesn't touch your other
# workflows. Run it from GitHub -> Actions -> "Import Index History" ->
# Run workflow. Uses the SAME secrets as your other working workflows.

on:
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import historical index data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python import_index_history.py