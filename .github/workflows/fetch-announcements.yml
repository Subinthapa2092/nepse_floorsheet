name: Fetch announcements

# Every 30 minutes from about 10:45 to 22:15 Nepal time, every day (companies also post on weekends).
# Cron is in UTC. It uses the same secrets as the other workflows.
on:
  schedule:
    - cron: "*/30 5-16 * * *"
  workflow_dispatch: {}

jobs:
  announcements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Save announcements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python fetch_announcements.py
