name: Inspect graphs

# Manual only. Prints what the intraday graph endpoints return. Read only, no secrets.
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python inspect_graphs.py
